play{
  modules{
    enabled += "ai.ClaudeModule"
  }
  //  Built in DefaultHttpErrorHandler returns html here
  http.errorHandler = "play.api.http.JsonHttpErrorHandler"
}

ai{
  name = "scala-anthropic-sdk"

  anthropic {
    api-key = ${?ANTHROPIC_API_KEY}
    model = "claude-haiku-5-5"
    max-tokens = 1024
  }
}